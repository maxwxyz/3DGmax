# Baut die portablen Apps fuer Windows, macOS (Apple-Chip) und Linux.
# Start von Hand: auf GitHub "Actions" -> "Apps bauen" -> "Run workflow". Die ZIP/TAR-Dateien liegen danach unten im
# Lauf unter "Artifacts".
name: Apps bauen
on:
  workflow_dispatch:
    inputs:
      plattform:
        description: "Welche Plattform bauen (macOS-Minuten zählen bei privaten Repos zehnfach)"
        type: choice
        default: alle
        options: [alle, Windows-x64, macOS-arm64, Linux-x64]
      tests:
        description: "Tests vor dem Bauen ausführen (aus = deutlich schneller; Selbsttest der App läuft immer)"
        type: boolean
        default: true
      jt:
        description: "Mit JT-Leser (TKJT, GPL v2+): JT 8–10 öffnen; baut den Konverter jt2glb mit"
        type: boolean
        default: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
          - os: macos-latest        # Apple-Chip (arm64)
            name: macOS-arm64
          - os: ubuntu-latest
            name: Linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      AKTIV: ${{ inputs.plattform == 'alle' || inputs.plattform == matrix.name }}
      DG_OHNE_TESTS: ${{ inputs.tests && '0' || '1' }}
      DG_MIT_JT: ${{ inputs.jt && '1' || '0' }}
      DG_TESTAUFGABE: test-ci          # ausfuehrlich, mit Zeitlimit je Test
    steps:
      - uses: actions/checkout@v4
        if: env.AKTIV == 'true'
      - uses: prefix-dev/setup-pixi@v0.8.10
        if: env.AKTIV == 'true'
        with:
          cache: true
          run-install: true
      - name: Grafik-Grundpakete (Linux)
        if: env.AKTIV == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            fonts-dejavu-core
      - name: MSVC-Umgebung (Windows, fuer den JT-Konverter)
        if: env.AKTIV == 'true' && inputs.jt && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: JT-Konverter bauen (TKJT)
        if: env.AKTIV == 'true' && inputs.jt
        shell: bash
        run: pixi run python packaging/jt/bauen.py
      - name: Bauen, testen, Selbsttest
        if: env.AKTIV == 'true'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) cmd //c "packaging\\build_windows.bat" ;;
            macOS)   bash packaging/build_mac.sh ;;
            Linux)   bash packaging/build_linux.sh ;;
          esac
      - uses: actions/upload-artifact@v4
        if: env.AKTIV == 'true'
        with:
          name: 3DGmax-${{ matrix.name }}${{ inputs.jt && '-JT' || '' }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
