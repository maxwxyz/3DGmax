[workspace]
name = "3dgmax"
channels = ["conda-forge"]
platforms = [
  { name = "mac-arm", platform = "osx-arm64", macos = "14.0" },
  { name = "mac-intel", platform = "osx-64", macos = "14.0" },
  "win-64",
  { name = "linux-x64", platform = "linux-64", glibc = "2.34" },
]

[dependencies]
python = "3.14.*"
pythonocc-core = { version = "8.0.1.*", build = "novtk*" }  # ohne VTK: sonst Qt aus conda, DLL-Konflikt mit PySide6
numpy = "*"
scipy = "*"
lxml = "*"
# PySide6 aus conda-forge (nicht PyPI): sonst DLL-Konflikt mit den conda-Laufzeitbibliotheken unter Windows
pyside6 = "6.11.*"

[pypi-dependencies]
pypdf = "*"

[feature.dev.dependencies]
pyinstaller = "6.*"
pytest-timeout = "*"

[feature.dev.pypi-dependencies]
pytest = "*"

[environments]
default = { features = ["dev"] }

[tasks]
test = { cmd = "python -m pytest -q", env = { QT_QPA_PLATFORM = "offscreen" } }
test-betroffen = { cmd = "python werkzeuge/tests_betroffen.py", env = { QT_QPA_PLATFORM = "offscreen" } }
test-ci = { cmd = "python -m pytest -v -rA --timeout=300 -p no:cacheprovider", env = { QT_QPA_PLATFORM = "offscreen" } }
machbarkeit = "python werkzeuge/machbarkeit.py"
start = "python -m programm.app"
selbsttest = "python -m programm.app --selbsttest"
bauen = { cmd = "pyinstaller --noconfirm --clean --workpath build/pyinstaller --distpath dist packaging/3dgmax.spec" }
