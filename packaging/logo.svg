<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 3DGmax: Wuerfel (3D-Modell) mit Massangabe und Toleranzrahmen (PMI) -->
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fe4"/>
      <stop offset="1" stop-color="#1a3f8f"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#hg)"/>
  <!-- Wuerfel isometrisch -->
  <polygon points="236,112 372,190 236,268 100,190" fill="#eef3ff"/>
  <polygon points="100,190 236,268 236,424 100,346" fill="#b9cbf2"/>
  <polygon points="236,268 372,190 372,346 236,424" fill="#8eaae6"/>
  <polyline points="236,112 372,190 236,268 100,190 236,112" fill="none" stroke="#0f2a66" stroke-width="7" stroke-linejoin="round"/>
  <polyline points="100,190 100,346 236,424 372,346 372,190" fill="none" stroke="#0f2a66" stroke-width="7" stroke-linejoin="round"/>
  <line x1="236" y1="268" x2="236" y2="424" stroke="#0f2a66" stroke-width="7"/>
  <!-- hervorgehobene Flaeche (PMI-Bezug) -->
  <polygon points="236,268 372,190 372,346 236,424" fill="#ff8a1f" opacity="0.85"/>
  <!-- Massangabe mit Pfeilen entlang der Vorderkante -->
  <line x1="262" y1="452" x2="398" y2="374" stroke="#ffb35c" stroke-width="9" stroke-linecap="round"/>
  <polygon points="250,459 284,428 290,449" fill="#ffb35c"/>
  <polygon points="410,367 370,382 384,399" fill="#ffb35c"/>
  <!-- Toleranzrahmen -->
  <rect x="282" y="70" width="190" height="64" rx="10" fill="#ffffff" stroke="#0f2a66" stroke-width="6"/>
  <line x1="346" y1="70" x2="346" y2="134" stroke="#0f2a66" stroke-width="6"/>
  <line x1="420" y1="70" x2="420" y2="134" stroke="#0f2a66" stroke-width="6"/>
  <circle cx="314" cy="102" r="17" fill="none" stroke="#0f2a66" stroke-width="5"/>
  <line x1="314" y1="78" x2="314" y2="126" stroke="#0f2a66" stroke-width="5"/>
  <line x1="290" y1="102" x2="338" y2="102" stroke="#0f2a66" stroke-width="5"/>
  <rect x="360" y="92" width="46" height="20" rx="4" fill="#ff8a1f"/>
  <text x="446" y="118" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#0f2a66" text-anchor="middle">A</text>
  <line x1="314" y1="134" x2="300" y2="230" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
</svg>
